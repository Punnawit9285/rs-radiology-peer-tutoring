<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS I Radiologic Anatomy &#183; Peer support 82</title>
<meta name="description" content="Question-first peer-tutoring deck: radiologic anatomy of the head, neck and chest (RS I).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  /* Layout: a lab-bench stage. One large card at a time on chart-recorder paper, a strip of eight lab stations above, a sticky pager below. Browse = one scrolling worksheet. */
  --paper: #f3f5f8;      /* page ground, cool grey */
  --sheet: #ffffff;      /* card */
  --sheet2: #edf0f5;     /* inset panels */
  --ink: #19202e;        /* text */
  --ink2: #4f5a6e;       /* secondary text */
  --rule: #d4dae4;       /* hairlines */
  --grid: #e9edf3;       /* chart-paper grid */
  --art: #ae1530;        /* arterial red: brand, tracings */
  --art-soft: #fbe5e9;
  --ven: #1f4f97;        /* venous blue: controls, second tracing */
  --ven-soft: #e2ebf8;
  --ok: #13744a; --ok-soft: #dff2e7;
  --bad: #b02f19; --bad-soft: #fbe6df;
  --warn: #775100; --warn-soft: #fbefd2;
  --scanbg: #ffffff;     /* paper behind real figures */
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
    --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
    --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1117; --sheet: #161a22; --sheet2: #1e232e; --ink: #e5e8ef; --ink2: #a3abbc; --rule: #2b3240; --grid: #1f2530;
  --art: #ff6f84; --art-soft: #3a1b23; --ven: #8db3f2; --ven-soft: #1a2840;
  --ok: #4fc98b; --ok-soft: #13301f; --bad: #ff8b74; --bad-soft: #391e17; --warn: #efc04e; --warn-soft: #32280e; --scanbg: #e6e3dc;
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ven); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cards ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(16px, 2.6vw, 34px); min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.eyebrow .id { font-weight: 600; color: var(--art); font-size: 1.12em; letter-spacing: .02em; }
.chip { border-radius: 999px; padding: 2px 9px; background: var(--sheet2); color: var(--ink2); white-space: nowrap; }
.chip.core { background: var(--art-soft); color: var(--art); }
.chip.kind { background: var(--ven-soft); color: var(--ven); }
.chip.grp { background: transparent; border: 1px dashed var(--rule); }
.concept h2, .secard h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.6em; line-height: 1.2; margin: 0 0 14px; text-wrap: balance; letter-spacing: .005em; }
.cbody { display: grid; gap: 16px; }
.cbody > * { min-width: 0; }
.muted { color: var(--ink2); font-weight: 400; }

/* ---------- question cards ---------- */
.stem { font-size: 1.26em; font-weight: 500; line-height: 1.45; margin: 2px 0 16px; text-wrap: pretty; }
.stem b { color: var(--art); font-weight: 600; }
.stem .muted { font-size: .82em; display: block; margin-top: 4px; }
.qfig { margin: 0 0 16px; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.opt { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--sheet); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: .6em .85em; cursor: pointer; transition: border-color .15s, background-color .15s, opacity .15s; line-height: 1.4; }
.opt:hover { border-color: var(--ven); }
.opt .L { font: 600 .88em var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--rule); color: var(--ink2); }
.opt .mk { font-weight: 700; min-width: 1em; }
.opt.sel { border-color: var(--ven); background: var(--ven-soft); }
.opt.sel .L { border-color: var(--ven); color: var(--ven); }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tfrow .opt { padding: .9em 1em; font-size: 1.08em; font-weight: 500; }
.rev .opt { cursor: default; }
.rev .opt.isans, .showall .opt.isans { border-color: var(--ok); background: var(--ok-soft); }
.rev .opt.isans .L, .showall .opt.isans .L { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.rev .opt.isans .mk::after, .showall .opt.isans .mk::after { content: "\2713"; color: var(--ok); }
.rev .opt.sel:not(.isans) { border-color: var(--bad); background: var(--bad-soft); }
.rev .opt.sel:not(.isans) .L { border-color: var(--bad); color: var(--bad); }
.rev .opt.sel:not(.isans) .mk::after { content: "\2717"; color: var(--bad); }
.rev .opt:not(.isans):not(.sel) { opacity: .55; }
.think { margin: 0; color: var(--ink2); font-style: italic; }
.explain { margin-top: 16px; background: var(--ok-soft); border-radius: 12px; padding: 14px 18px; }
.qcard:not(.rev) .explain { display: none; }
.showall .qcard .explain { display: block; }
.explain .ans { font: 600 1.02em var(--f-display); color: var(--ok); margin-bottom: 4px; }
.explain p { margin: 0; }
.flag { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: .9em; }
.flag b { color: var(--warn); }

/* ---------- concept building blocks ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.figpair { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: center; }
@media (max-width: 760px) { .two, .cols2, .cols3, .figpair { grid-template-columns: 1fr; } }
.mini { background: var(--sheet2); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.mini h4 { margin: 0 0 6px; font: 600 1em var(--f-display); letter-spacing: .01em; }
.mini.art h4 { color: var(--art); }
.mini.ven h4 { color: var(--ven); }
.mini p { margin: 0; }
.mini ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.pts { margin: 0; padding-left: 1.2em; display: grid; gap: 7px; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; }
.steps.tight { gap: 3px; }
.note { margin: 0; background: var(--ven-soft); border-radius: 10px; padding: 10px 14px; }
.trap { margin: 0; background: var(--warn-soft); border-radius: 10px; padding: 10px 14px; }
.trap::before { content: "Exam trap \00B7  "; font-weight: 600; color: var(--warn); }
.eqn { font: 600 1.65em var(--f-display); text-align: center; letter-spacing: .02em; padding: 6px 0; }
.eqn span { color: var(--art); }
.speeds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .speeds { grid-template-columns: 1fr; } }
.speed { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--sheet); }
.sp-h { display: grid; gap: 2px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--rule); }
.sp-h .mono { font-family: var(--f-mono); font-size: .8em; color: var(--ink2); }
.s1 .sp-h b { color: var(--art); }
.s2 .sp-h b { color: var(--warn); }
.s3 .sp-h b { color: var(--ven); }
.speed ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.flow.col { flex-direction: column; align-items: stretch; }
.fbox { border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 8px 12px; flex: 1 1 140px; min-width: 0; }
.fbox.start { background: var(--sheet2); }
.fbox.end { background: var(--ok-soft); border-color: var(--ok); }
.fbox.art { background: var(--art-soft); border-color: var(--art); }
.fbox.ven { background: var(--ven-soft); border-color: var(--ven); }
.farrow { color: var(--ink2); font-weight: 600; flex: none; text-align: center; }
.flow.col .farrow { font-size: .9em; }
.fstack { display: grid; gap: 8px; flex: 2 1 260px; min-width: 0; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } }
.cycle { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.cycle .ph { flex: 1 1 130px; background: var(--sheet2); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: .92em; display: grid; gap: 2px; align-content: start; }
.cycle .ph span { font-weight: 400; color: var(--ink2); font-size: .88em; }
.cycle .sd { flex: none; align-self: center; font: 700 .9em var(--f-mono); color: var(--sheet); background: var(--ink); border-radius: 999px; padding: 4px 10px; }

/* ---------- tables ---------- */
.tblwrap { overflow-x: auto; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl caption { text-align: left; font: 600 .95em var(--f-display); padding-bottom: 6px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl thead th { font-family: var(--f-mono); font-size: .76em; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); background: var(--sheet2); }
.tbl td.num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); white-space: nowrap; }
.tbl .up { color: var(--art); font-weight: 600; }
.tbl .dn { color: var(--ven); font-weight: 600; }
.tbl thead th.up { color: var(--art); }
.tbl thead th.dn { color: var(--ven); }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.dogtbl td:nth-child(2), .dogtbl td:nth-child(3), .dogtbl td:nth-child(4) { text-align: center; white-space: nowrap; }

/* ---------- real figures cropped from the course material ---------- */
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }
.scan { margin: 0; min-width: 0; display: grid; gap: 6px; align-content: start; }
.paperimg { background: var(--scanbg); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; isolation: isolate; }
.scan img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(440px, 62vh); margin: 0 auto; mix-blend-mode: multiply; cursor: zoom-in; border-radius: 4px; }
.scan.tall img { max-height: min(480px, 66vh); }
.scanrow .scan img { max-height: 360px; }
.scan figcaption { font-size: .84em; line-height: 1.4; color: var(--ink2); text-wrap: pretty; }
.scan figcaption .src { font-family: var(--f-mono); font-size: .88em; white-space: nowrap; opacity: .9; }
.scan figcaption .src::before { content: "\00B7  "; }
.scan figcaption.srconly .src::before { content: none; }
.scanrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start; min-width: 0; }
.qfig .scan { max-width: 760px; }
.qfig .scan.tall { max-width: 560px; }

/* ---------- cloze blanks: {{key detail}} in concept cards ---------- */
.cz { border-radius: 4px; padding: 0 .22em; background: var(--sheet2); color: transparent; box-shadow: inset 0 -2px 0 var(--art); cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: color .18s, background-color .18s; }
.cz * { color: transparent !important; }
.cz:hover { background: var(--art-soft); }
.cz.on, .czopen .cz, .showall .cz { color: inherit; background: var(--art-soft); }
.cz.on *, .czopen .cz *, .showall .cz * { color: inherit !important; }
.cz.last { animation: czpop .5s ease-out; }
@keyframes czpop { 0% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 4px var(--art-soft); } 100% { box-shadow: inset 0 -2px 0 var(--art), 0 0 0 0 transparent; } }
@media print { .cz { color: inherit; background: none; } .cz * { color: inherit !important; } }

/* ---------- figure zoom ---------- */
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(6, 8, 12, .88); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom[hidden] { display: none; }
.zoom .zbox { display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.zoom .zpaper { background: #fff; border-radius: 10px; padding: 10px; max-width: min(1700px, 100%); }
.zoom img { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; }
.zoom .zcap { color: #e5e8ef; font-size: .92em; text-align: center; max-width: 900px; margin: 0; }

/* Thai explanation under each concept card (student deck: collapsible; tutor deck: open) */
.thx { margin-top: 16px; border: 1px solid var(--rule); border-left: 3px solid var(--ok); border-radius: 10px; background: var(--sheet); padding: 0 14px; }
.thx summary { cursor: pointer; padding: 10px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.thx summary::marker, .thx summary::-webkit-details-marker { color: var(--ok); }
.thx-h { font: 600 1.02em var(--f-display); color: var(--ok); }
.thx-s { font: .74em var(--f-mono); color: var(--ink2); }
.thx[open] summary { border-bottom: 1px dashed var(--rule); margin-bottom: 10px; }
.thx-body { display: grid; gap: 9px; padding-bottom: 14px; line-height: 1.7; font-family: "IBM Plex Sans Thai", var(--f-body); }
.thx-body p { margin: 0; }
ul.thx-body { margin: 0; padding: 0 0 14px 1.2em; gap: 6px; }
ul.thx-body li::marker { color: var(--ok); }
.thx-body b { font-weight: 600; color: var(--ink); }

/* cover: counts + QR to the live deck (student deck start card and PDF cover) */
.coverline { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; margin: 4px 0 22px; padding: 14px 0 16px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts { display: flex; gap: 44px; }
.counts > div { display: grid; }
.counts b { font: 600 3.2em/1 var(--f-display); letter-spacing: -.01em; }
.counts span { font: .8em var(--f-mono); color: var(--ink2); letter-spacing: .04em; margin-top: 5px; }
.qrlink { display: grid; justify-items: end; gap: 6px; color: var(--ink2); text-decoration: none; }
.qrlink img { width: 112px; height: 112px; display: block; }
.qrlink span { font: .72em var(--f-mono); }
.qrlink:hover span { color: var(--ven); text-decoration: underline; }
.legend { margin: 14px 0 0; font: .8em var(--f-mono); color: var(--ink2); }
.legend .chip { margin-right: 6px; }
@media (max-width: 560px) { .qrlink img { display: none; } .qrlink { justify-items: start; } .counts b { font-size: 2.6em; } }

/* figure that would give away a card's blanks: collapsed behind a summary (closed in the PDF) */
.figans { border: 1px dashed var(--rule); border-radius: 10px; padding: 8px 12px; }
.figans summary { cursor: pointer; font: 500 .85em var(--f-mono); color: var(--ink2); }
.figans[open] summary { margin-bottom: 8px; }
/* short concept cards (data/lite.js): arrow chains and brief bullets */
.lt { display: grid; gap: 10px; align-content: start; }
.lt-two { align-items: start; }
.lt-figs { display: grid; gap: 12px; }
.lt-chain { margin: 0; padding: 8px 12px; background: var(--sheet2); border-radius: 8px; line-height: 1.65; font-weight: 500; }
.lt-ar { color: var(--art); font-weight: 700; padding: 0 .12em; }
.lt-pts { margin: 0; padding-left: 1.15em; display: grid; gap: 4px; line-height: 1.5; }
.lt-h { margin: 4px 0 -4px; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.lt-trap { margin: 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 8px; padding: 6px 10px; font-size: .95em; }
.lt-p { margin: 0; }
.lt-tbl { width: 100%; border-collapse: collapse; font-size: .95em; }
.lt-tbl th { text-align: left; font: 600 .78em var(--f-mono); text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); border-bottom: 1.5px solid var(--rule); padding: 4px 8px; }
.lt-tbl td { border-bottom: 1px solid var(--rule); padding: 5px 8px; vertical-align: top; }
.lt .eqn { font-size: 1.15em; padding: 2px 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--sheet); border-bottom: 1px solid var(--rule); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 18px; align-items: center; }
@media (max-width: 1020px) { .bar { grid-template-columns: minmax(0, 1fr) auto; } .tabs { grid-column: 1 / -1; order: 3; } }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand svg { flex: none; width: 38px; height: 22px; }
.brand b { display: block; font: 600 1.05rem var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.brand small { display: block; color: var(--ink2); font: .72rem var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding-block: 2px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink2); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab:hover { border-color: var(--ven); color: var(--ink); }
.tab .k { font-family: var(--f-mono); color: var(--art); margin-right: 6px; font-weight: 600; }
.tab[aria-current="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.tab[aria-current="true"] .k { color: var(--art-soft); }
.ctrls { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 6px 11px; font-size: .85rem; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ven); color: var(--sheet); }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--ink2); cursor: pointer; user-select: none; white-space: nowrap; }
.chk input { accent-color: var(--art); width: 16px; height: 16px; margin: 0; }
.icon { display: inline-grid; place-items: center; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 8px; height: 32px; width: 34px; padding: 0; cursor: pointer; }
.icon svg { width: 16px; height: 16px; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 0; }
#present { max-width: 1180px; margin: 0 auto; }
#present .card { font-size: clamp(15px, .5vw + 11.5px, 20px); }
.stage { min-height: 55vh; }
.eyebrow .sp { flex: 1; }
.pager { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px 10px; align-items: center; background: var(--paper); padding-block: 12px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; border-top: 1px solid var(--rule); }
.pos { font-family: var(--f-mono); font-size: .82rem; color: var(--ink2); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos span { color: var(--art); font-weight: 600; }
.btn { border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-size: .95rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ven); }
.btn.primary { background: var(--art); color: var(--sheet); border-color: var(--art); min-width: 8.5em; }
.btn.small { padding: 5px 11px; font-size: .85rem; }
.btn:disabled { opacity: .4; cursor: default; }
.prog { grid-column: 1 / -1; height: 3px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--art); width: 0; transition: width .2s; }
.keys { grid-column: 1 / -1; font: .72rem var(--f-mono); color: var(--ink2); text-align: center; }
@media (max-width: 560px) { .pager { grid-template-columns: auto minmax(0, 1fr) auto; } #reveal { grid-column: 1 / -1; order: 5; } .keys { display: none; } }

/* intro and section cards */
.secard .lede { font-size: 1.1em; color: var(--ink2); margin: 0 0 16px; max-width: 65ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 26px; font-family: var(--f-mono); font-size: .82em; color: var(--ink2); margin-bottom: 16px; }
.stats b { font: 600 1.7em var(--f-display); color: var(--ink); display: block; line-height: 1.1; }
.minih { font: 600 .8em var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); margin: 0 0 8px; }
.toc { margin: 0; padding-left: 0; list-style: none; columns: 2 280px; column-gap: 28px; }
.toc li { break-inside: avoid; margin-bottom: 5px; }
.toc .tid { font-family: var(--f-mono); color: var(--art); font-size: .85em; margin-right: 8px; }
.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 4px 0 16px; }
.station { text-align: left; border: 1px solid var(--rule); background: var(--sheet2); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.station:hover { border-color: var(--ven); }
.station .k { font: 600 .78rem var(--f-mono); color: var(--art); }
.station b { font: 600 1.05rem var(--f-display); }
.station span:last-child { color: var(--ink2); font-size: .86rem; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: 14px; }
.howto div { background: var(--sheet2); border-radius: 10px; padding: 10px 12px; font-size: .92em; }
.howto b { display: block; font-family: var(--f-display); margin-bottom: 2px; }
kbd { font: .82em var(--f-mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--sheet); }

/* browse */
#browse { max-width: 1000px; margin: 0 auto; padding-bottom: 48px; }
.btools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding-block: 4px 6px; }
.btools input[type="search"] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 9px 12px; }
.bcount { font: .8rem var(--f-mono); color: var(--ink2); }
.bsec { display: grid; gap: 14px; margin-top: 28px; }
.bsec > header { scroll-margin-top: 130px; }
.bsec > header h2 { font: 600 1.5rem var(--f-display); margin: 0; text-wrap: balance; }
.bsec > header p { margin: 4px 0 0; color: var(--ink2); }
.bsec > header .eyebrow { margin-bottom: 6px; }
#blist .card { font-size: 15px; scroll-margin-top: 130px; }
#blist .stem { font-size: 1.1em; }
.qfoot { margin-top: 12px; display: flex; justify-content: flex-end; }

/* Thai bullet explanations & concept key points */
.ex-list { margin: 6px 0 0; padding-left: 1.25em; display: grid; gap: 5px; line-height: 1.55; }
.ex-list li::marker { color: var(--ok); }
.tpoints { margin-bottom: 14px; background: var(--ven-soft); border-left: 3px solid var(--ven); border-radius: 10px; padding: 10px 14px; }
.tpoints .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ven); margin-bottom: 4px; }
.tpoints ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }
.traps-box { margin: 12px 0; background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 10px; padding: 10px 14px; }
.traps-box .tp-head { font: 600 .75em var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--warn); margin-bottom: 4px; }
.traps-box ul { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; line-height: 1.5; }
.brand > div { min-width: 0; }

@media (max-width: 640px) { .bar { grid-template-columns: minmax(0, 1fr); position: relative; } .ctrls { justify-content: flex-start; } }

/* Shared registry for both pages (deck + tutor notes) and print.js.
   Concept-card HTML may mark key details as {{blanks}}: they render as click-to-reveal cloze spans.
   CVS.fig(name, caption, pdf, page[, cls]) builds a click-to-zoom course figure from img/<name>.jpg
   (sizes from data/figs.js); pdf is "hn" (head & neck handout) or "rs" (respiratory handout). */
window.CVS = {
  sections: [],
  dims: {},
  SRC: { hn: 'H&amp;N radiology handout', rs: 'RS radiology handout', ac79: 'AC79 RS I MCQ key (PS81 edit)', ac80: 'AC80 RS I MCQ recall' },
  cloze: function (h) { return String(h).replace(/\{\{([\s\S]*?)\}\}/g, '<span class="cz">$1</span>'); },
  fig: function (name, cap, pdf, page, cls) {
    var d = this.dims[name];
    if (!d) throw new Error('no image ' + name);
    var alt = String(cap).replace(/<[^>]+>/g, '').replace(/"/g, '&quot;');
    return '<figure class="scan' + (cls ? ' ' + cls : '') + '"><div class="paperimg"><img src="img/' + name + '.jpg" width="' + d[0] + '" height="' + d[1] + '" alt="' + alt + '" loading="lazy" decoding="async"></div><figcaption>' + cap + ' <span class="src">' + this.SRC[pdf] + ', p.' + page + '</span></figcaption></figure>';
  },
  /* Options are written with the answer first; shuffle them once, the same way everywhere (seeded by the item ID).
     Options such as "None ..." or "All ..." stay last. Set keep: true to leave an item's order alone. */
  shuffle: function (it) {
    if (it.t !== 'q' || it.keep) return;
    var h = 2166136261, i;
    for (i = 0; i < it.id.length; i++) { h ^= it.id.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var rnd = function () { h = (h + 0x6D2B79F5) >>> 0; var t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    var idx = it.o.map(function (o, k) { return k; });
    var free = idx.filter(function (k) { return !/^(None|All |Both |Neither )/.test(it.o[k]); });
    var tail = idx.filter(function (k) { return free.indexOf(k) < 0; });
    for (i = free.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), t = free[i]; free[i] = free[j]; free[j] = t; }
    var order = free.concat(tail), A = [].concat(it.a);
    it.o = order.map(function (k) { return it.o[k]; });
    var na = A.map(function (a) { return order.indexOf(a); });
    it.a = Array.isArray(it.a) ? na : na[0];
  },
  add: function (sec) {
    sec.items.forEach(function (it) { if (it.html) it.html = window.CVS.cloze(it.html); window.CVS.shuffle(it); });
    this.sections.push(sec);
  }
};

  { t: 'q', id: 'H11', src: 'H&N p.13', core: true,
    q: 'According to the lecture, CT is the best assessment for which region?',
    o: ['Paranasal sinuses and nasal cavity', 'Optic pathway', 'Soft tissue of the face and neck', 'Major vessels without contrast agent', 'None: MRI is better for every region'], a: 0,
    ex: 'CT is the best assessment for the paranasal sinuses and nasal cavity and the primary modality for the bony orbit, skull base and temporal bone. The optic pathway, face and neck soft tissue and flow imaging are MRI strengths.' },
  { t: 'q', id: 'H12', src: 'H&N p.14, 21',
    q: 'Which is a <b>disadvantage of CT</b> compared with MRI?',
    o: ['High radiation', 'Long scanning time', 'Contraindicated with a cardiac pacemaker', 'Cannot show bone', 'Cannot be reformatted into other planes'], a: 0,
    ex: 'CT uses ionizing radiation (high dose). Long scanning time and the pacemaker contraindication belong to MRI. CT shows bone best and is reformatted with MPR.' },
  { t: 'tf', id: 'H13', src: 'H&N p.13',
    q: 'MRI is the primary imaging modality for the temporal bone and the skull base.', a: false,
    ex: 'False. CT is the primary modality there: bony detail (ossicles, air cells, foramina, fracture lines) is CT territory.' },
  { t: 'q', id: 'H14', src: 'H&N p.13', core: true,
    q: 'A 25-year-old is hit in the eye by a squash ball. You want to see the <b>bony walls</b> of the orbit. Which study fits the lecture best?',
    o: ['CT, bone window', 'MRI', 'Towne’s view', 'Skull lateral', 'MRI with flow sequences'], a: 0,
    ex: 'CT is the primary modality for the bony orbit and shows thin walls such as the floor and lamina papyracea. MRI is chosen for soft tissue and the optic pathway, not for fine bone.' },
  { t: 'c', id: 'H-C4', title: 'Reading CT: windows, MPR and VRT', src: 'H&N p.15–18',
    html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Tool</th><th>What it does</th></tr></thead><tbody>' +
      '<tr><td><b>Windowing</b> (grey-level mapping)</td><td>Chooses which range of CT numbers is spread across the grey scale. In a <b>{{soft tissue window}}</b> brain, muscle and fat are separated and bone is plain white. In a <b>{{bone window}}</b> soft tissue looks flat grey but cortex, trabeculae and air cells show.</td></tr>' +
      '<tr><td><b>MPR</b> (multiplanar reconstruction)</td><td>The stack of {{axial}} images is re-sliced into new planes, with no new scan.</td></tr>' +
      '<tr><td><b>VRT</b> (volume rendering technique)</td><td>A {{3-D}} surface view of the whole volume, shown on the slide for {{facial fractures}}.</td></tr></tbody></table></div>' +
      '<div class="two">' + CVS.fig('hn-windows', 'The same level shown in two windows.', 'hn', 16) + CVS.fig('hn-mpr', 'MPR: one transverse stack, two new planes.', 'hn', 17) + '</div>' +
      '<p class="note">On the MPR slide the yellow line across the transverse image gives the {{coronal}} plane and the red line gives the {{sagittal}} plane. Windowing and MPR reuse the same data: no extra scan, no extra dose.</p>' },
  { t: 'q', id: 'H15', src: 'H&N p.16', core: true,
    q: 'Which display is used for this axial CT image?', fig: CVS.fig('hn-win-bone-q', 'Axial CT at the skull base.', 'hn', 16),
    o: ['Bone window', 'Soft tissue window', 'Lung window', 'Volume rendering (VRT)', 'T2-weighted MRI'], a: 0,
    ex: 'Brain and muscle are a flat mid-grey while cortex, trabecular bone and the mastoid air cells are sharp: a bone window.' },
  { t: 'tf', id: 'H16', src: 'H&N p.16',
    q: 'To see the same CT slice in a bone window instead of a soft tissue window, the patient has to be scanned again.', a: false,
    ex: 'False. Windowing only changes how the stored CT numbers are mapped to grey levels on the screen.' },
  { t: 'q', id: 'H17', src: 'H&N p.17', core: true,
    q: 'Coronal and sagittal CT images of the sinuses are usually produced by:',
    o: ['Multiplanar reconstruction (MPR) of the axial data', 'A second scan with the head turned', 'Volume rendering technique (VRT)', 'Changing the window level', 'Giving intravenous contrast'], a: 0,
    ex: 'MPR re-slices the stack of axial images into other planes. VRT makes a 3-D surface picture, and windowing changes grey levels.' },
  { t: 'q', id: 'H18', src: 'H&N p.18',
    q: 'These 3-D pictures of a facial fracture are made with which technique?', fig: CVS.fig('hn-vrt', 'CT of a facial fracture shown four ways.', 'hn', 18),
    o: ['Volume rendering technique (VRT)', 'Multiplanar reconstruction (MPR)', 'Bone window', 'Waters’ view', 'MRI'], a: 0,
    ex: 'The bottom row is a volume rendering (VRT) of the CT data. The top row shows soft tissue window, bone window and a coronal MPR.' },
  { t: 'open', id: 'H19', src: 'H&N p.16',
    q: 'On one head CT you need to judge both the brain and the fracture lines in the skull. What do you change, and why does it work?',
    ans: 'Change the window. The same CT data are viewed in a soft tissue (brain) window to judge the brain and in a bone window to see the fracture lines; each window spreads a different range of CT numbers over the grey scale.' },
  { t: 'c', id: 'H-C5', title: 'MRI: soft tissue without radiation', src: 'H&N p.19–21',
    html: '<div class="two"><div class="stack"><ul class="pts"><li>Uses a strong {{magnetic field}}, magnetic gradients and {{radiofrequency}} waves: {{no ionizing radiation}}.</li>' +
      '<li>Excellent {{soft-tissue characterization}}.</li><li>Preferred for the {{optic pathway}} and the soft tissue of the face and neck.</li></ul></div>' +
      CVS.fig('hn-mri', 'Axial and coronal MRI of the face and neck.', 'hn', 20) + '</div>' +
      '<div class="cols2"><div class="mini art"><h4>Advantages</h4><ul><li>Soft tissue discrimination</li><li>Sensitive to {{blood flow}}: major vessels seen without a contrast agent</li><li>Multiplanar display</li><li>Safe to repeat (no X-rays)</li></ul></div>' +
      '<div class="mini ven"><h4>Disadvantages</h4><ul><li>High cost</li><li>{{Long scanning time}}</li><li>Contraindicated with a {{cardiac pacemaker}}, an {{ear implant}} or {{claustrophobia}}</li></ul></div></div>' },
  { t: 'q', id: 'H20', src: 'H&N p.21', core: true,
    q: 'Which patient should <b>not</b> have MRI, according to the lecture?',
    o: ['A patient with a cardiac pacemaker', 'A patient with chronic sinusitis', 'A patient who had a CT yesterday', 'A patient with a skull fracture', 'A patient who needs the optic nerve examined'], a: 0,
    ex: 'Cardiac pacemaker, ear implant and claustrophobia are the listed contraindications. Recent CT is irrelevant, and the optic nerve is an MRI indication.' },
  { t: 'q', id: 'H21', src: 'H&N p.21',
    q: 'MRI can show the major vessels without a contrast agent because it:',
    o: ['Is sensitive to blood flow', 'Uses ionizing radiation', 'Has a short scanning time', 'Shows cortical bone in fine detail', 'Uses iodine-based contrast'], a: 0,
    ex: 'Flowing blood behaves differently from stationary tissue on MRI, so vessels can be shown without contrast.' },
  { t: 'tf', id: 'H22', src: 'H&N p.20', core: true,
    q: 'MRI is the preferred modality for the optic pathway.', a: true,
    ex: 'True: MRI is preferred for the optic pathway and the soft tissue of the face and neck.' },
  { t: 'q', id: 'H23', src: 'H&N p.21',
    q: 'Which is a disadvantage of MRI listed in the lecture?',
    o: ['Long scanning time', 'High radiation dose', 'Two-dimensional images only', 'Poor soft-tissue contrast', 'Not multiplanar'], a: 0,
    ex: 'MRI: high cost, long scanning time, contraindications (pacemaker, ear implant, claustrophobia). Radiation belongs to CT; MRI is multiplanar with excellent soft-tissue contrast.' },
  { t: 'c', id: 'H-C6', title: 'Choosing the modality for the question', src: 'H&N p.5–21',
    html: '<div class="tblwrap"><table class="tbl"><thead><tr><th>Clinical question</th><th>First choice in the lecture</th><th>Why</th></tr></thead><tbody>' +
      '<tr><td>Simple skull fracture, foreign body</td><td>{{Plain film}} can help</td><td>Cheap, available, low dose</td></tr>' +
      '<tr><td>Screening for sinusitis</td><td>Plain {{Waters}} view</td><td>Shows the paranasal sinuses</td></tr>' +
      '<tr><td>Bony orbit, skull base, temporal bone, sinus anatomy</td><td>{{CT}} (bone window)</td><td>Fine bone, no superimposition</td></tr>' +
      '<tr><td>Complex facial fracture</td><td>CT with {{MPR and VRT}}</td><td>Plain films miss overlapping fragments</td></tr>' +
      '<tr><td>Optic pathway, soft tissue of face and neck</td><td>{{MRI}}</td><td>Best soft-tissue characterization</td></tr>' +
      '<tr><td>Vessels without contrast agent</td><td>MRI</td><td>Sensitive to {{blood flow}}</td></tr>' +
      '<tr><td>Pacemaker, ear implant, claustrophobia</td><td>Avoid MRI → {{CT}}</td><td>MRI contraindications</td></tr>' +
      '<tr><td>Child needing repeated soft-tissue imaging</td><td>MRI</td><td>{{No ionizing radiation}}</td></tr></tbody></table></div>' +
      '<p class="note">Ask two things: is the target <b>bone or air</b> (→ CT) or <b>soft tissue</b> (→ MRI)? Then check the patient: implant or claustrophobia rules MRI out; repeated studies in a child favour the modality without radiation.</p>' },
  { t: 'q', id: 'H24', src: 'H&N p.13, 21', core: true,
    q: 'A 60-year-old with a cardiac pacemaker has facial trauma and a suspected orbital floor fracture. Which study?',
    o: ['CT', 'MRI', 'MRI with contrast', 'Towne’s view', 'No imaging is possible'], a: 0,
    ex: 'Bony orbit → CT, and the pacemaker rules MRI out anyway.' },
  { t: 'q', id: 'H25', src: 'H&N p.6, 13, 20', core: true,
    q: 'Which pairing of question and first-choice modality fits the lecture?',
    o: ['Lesion along the optic pathway → MRI', 'Middle-ear ossicles and mastoid air cells → MRI', 'Sinus anatomy before surgery → Towne’s view', 'Base-of-skull fracture → plain skull AP', 'Neck mass in a claustrophobic patient → MRI'], a: 0,
    ex: 'Optic pathway → MRI. Temporal bone → CT; sinus anatomy → CT; base of skull → CT; claustrophobia is an MRI contraindication.' },
  { t: 'open', id: 'H26', src: 'H&N p.6, 14',
    q: 'Give one reason to start with a plain film and one reason to go straight to CT after a head injury.',
    ans: 'Plain film: low cost, wide availability, low dose and no patient cooperation needed, useful for a simple skull fracture or a foreign body. CT: plain films are two-dimensional and suboptimal for fractures of the base of skull and complex facial fractures; CT shows them in cross-section, with MPR and 3-D.' },
  { t: 'tf', id: 'H27', src: 'H&N p.21',
    q: 'For a child who needs repeated imaging of a neck soft-tissue mass, MRI has the advantage of no ionizing radiation.', a: true,
    ex: 'True. MRI gives the best soft-tissue detail and uses no ionizing radiation; CT would add dose with each study.' }
]});

/* Section S: the skull on radiographs (H&N radiology handout, slides 7–8 and 23–27). */
CVS.add({ id: 'S', short: 'Skull', title: 'The skull on radiographs', kind: 'Lecture',
  blurb: 'Cranial and facial bones, and the landmarks to name on AP and lateral skull films, including the sella turcica.',
  items: [
  { t: 'c', id: 'S-C1', title: 'Bones of the skull: cranial vs facial', src: 'H&N p.7, 24',
    html: '<div class="two"><div class="stack"><div class="cols2"><div class="mini"><h4>“Calvarium” on the slide · 6</h4><ul><li>Frontal</li><li>Parietal</li><li>Temporal</li><li>Occipital</li><li>{{Ethmoid}}</li><li>{{Sphenoid}}</li></ul></div>' +
      '<div class="mini"><h4>Facial bones · 8</h4><ul><li>Maxilla</li><li>{{Mandible}}</li><li>Zygomatic</li><li>{{Palatine}}</li><li>{{Lacrimal}}</li><li>{{Vomer}}</li><li>Nasal</li><li>{{Inferior turbinate}}</li></ul></div></div>' +
      '<p class="trap">Two bones that sit deep behind the face still count as {{cranial}} bones here. The {{inferior turbinate}} (inferior nasal concha) is its own facial bone, but the middle nasal concha belongs to the {{ethmoid}} (Netter figure, p.7).</p>' +
      '<p class="note">The slide heads the first list “Calvarium”. Anatomy texts call these six the neurocranium; strictly, the calvaria is only the skull cap.</p></div>' +
      CVS.fig('hn-skull-netter-ap', 'Anterior view of the skull, each bone in its own colour.', 'hn', 7) + '</div>' },
  { t: 'q', id: 'S1', src: 'H&N p.24', core: true,
    q: 'Which bone is listed with the <b>facial bones</b>, not the calvarium?',
    o: ['Vomer', 'Ethmoid', 'Sphenoid', 'Temporal', 'Occipital'], a: 0,
    ex: 'The vomer (lower nasal septum) is a facial bone. Ethmoid, sphenoid, temporal and occipital are among the six cranial bones on the slide.' },
  { t: 'q', id: 'S2', src: 'H&N p.24',
    q: 'Which of these is a <b>cranial</b> bone on the slide?',
    o: ['Ethmoid', 'Lacrimal', 'Palatine', 'Zygomatic', 'Inferior turbinate'], a: 0,
    ex: 'The ethmoid is listed under the calvarium even though most of it lies between the orbits. The other four are facial bones.' },
  { t: 'tf', id: 'S3', src: 'H&N p.24',
    q: 'The inferior turbinate (inferior nasal concha) is a separate facial bone.', a: true,
    ex: 'True. It is on the facial-bone list; the middle and superior conchae are parts of the ethmoid.' },
  { t: 'tf', id: 'S4', src: 'H&N p.7',
    q: 'The middle nasal concha is part of the maxilla.', a: false,
    ex: 'False. On the Netter figure the middle nasal concha is labelled under the ethmoidal bone.' },
  { t: 'c', id: 'S-C2', title: 'Skull AP radiograph: landmarks', src: 'H&N p.25',
    html: '<div class="two">' + CVS.fig('hn-skull-ap', 'Skull AP radiograph with labels.', 'hn', 25, 'tall') +
      '<div class="stack"><ul class="pts"><li>Midline, top down: the {{crista galli}} between the orbits, the {{nasal septum}} below it, the mandible at the bottom.</li>' +
      '<li>Across each orbit: the {{lesser wing of sphenoid}} runs as a near-horizontal line (orange dots); the {{greater wing of sphenoid}} as an oblique line (maroon dots) inside the orbital outline.</li>' +
      '<li>Below the orbits: the {{maxillary sinuses}}. At the lateral edges, the {{mastoid processes}}.</li>' +
      '<li>Vault: the {{frontal bone}} in the middle, the {{parietal bones}} at the sides.</li></ul>' +
      '<p class="note">The sphenoid looks like a bat: body in the middle, small wings on top, big wings below and lateral (inset, p.25).</p>' +
      CVS.fig('hn-sphenoid', 'The sphenoid bone seen from behind.', 'hn', 25) + '</div></div>' },
  { t: 'q', id: 'S5', src: 'H&N p.25', core: true,
    q: 'On this skull AP radiograph, what does label <b>4</b> point to?', fig: CVS.fig('hn-skull-ap-num', 'Skull AP radiograph, labels replaced by numbers.', 'hn', 25),
    o: ['Crista galli', 'Nasal septum', 'Lesser wing of sphenoid', 'Frontal sinus', 'Dorsum sellae'], a: 0,
    ex: 'Label 4 points to the small midline bony spike between the orbits, above the nasal cavity: the crista galli of the ethmoid.' },
  { t: 'q', id: 'S6', src: 'H&N p.25',
    q: 'Label <b>3</b> marks the near-horizontal dotted line across the upper orbit. What is it?', fig: CVS.fig('hn-skull-ap-num', 'Skull AP radiograph, labels replaced by numbers.', 'hn', 25),
    o: ['Lesser wing of sphenoid', 'Greater wing of sphenoid', 'Superior orbital margin', 'Crista galli', 'Mastoid process'], a: 0,
    ex: 'The lesser wing runs nearly horizontally across the upper orbit; the greater wing is the oblique line lower down (label 6).' },
  { t: 'q', id: 'S7', src: 'H&N p.25', core: true,
    q: 'Label <b>7</b> points to which structure?', fig: CVS.fig('hn-skull-ap-num', 'Skull AP radiograph, labels replaced by numbers.', 'hn', 25),
    o: ['Mastoid process', 'Maxillary sinus', 'Greater wing of sphenoid', 'Condyle of mandible', 'Parietal bone'], a: 0,
    ex: 'Label 7 is at the lateral skull base below the orbit level: the mastoid process. The maxillary sinus is label 8, nearer the midline.' },
  { t: 'q', id: 'S8', src: 'H&N p.25',
    q: 'Label <b>6</b> is the oblique dotted line inside the orbit. What is it?', fig: CVS.fig('hn-skull-ap-num', 'Skull AP radiograph, labels replaced by numbers.', 'hn', 25),
    o: ['Greater wing of sphenoid', 'Lesser wing of sphenoid', 'Lamina papyracea', 'Zygomatic arch', 'Nasal septum'], a: 0,
    ex: 'The greater wing of sphenoid forms the oblique line in the orbit on the AP film (and the lateral orbital wall).' },
  { t: 'c', id: 'S-C3', title: 'Skull lateral radiograph: landmarks', src: 'H&N p.26',
    html: '<div class="two">' + CVS.fig('hn-skull-lat', 'Skull lateral radiograph with labels.', 'hn', 26, 'tall') +
      '<div class="stack"><ul class="pts"><li>Vault: {{frontal}} in front, {{parietal}} on top, {{occipital}} at the back.</li>' +
      '<li>Sinuses from front to back: {{frontal sinus}} above the orbit, {{ethmoid sinus}} between the orbits, {{sphenoid sinus}} under the sella, {{maxillary sinus}} above the hard palate.</li>' +
      '<li>Central skull base: the {{sella turcica}} on top of the sphenoid body; the {{clivus}} slopes down and back from it. The {{greater wing of sphenoid}} is the curved dotted line in front.</li>' +
      '<li>Behind and below: the {{mastoid air cells}}, with the {{condyle of the mandible}} just in front of them.</li>' +
      '<li>The {{palatine process of the maxilla}} is the hard palate, the floor of the nose.</li></ul></div></div>' },
  { t: 'q', id: 'S9', src: 'H&N p.26', core: true,
    q: 'On this lateral skull film, what is label <b>2</b>?', fig: CVS.fig('hn-skull-lat-num', 'Skull lateral radiograph, labels replaced by numbers.', 'hn', 26),
    o: ['Sella turcica', 'Sphenoid sinus', 'Clivus', 'Mastoid air cells', 'Frontal sinus'], a: 0,
    ex: 'Label 2 points to the cup-shaped fossa on top of the sphenoid body: the sella turcica.' },
  { t: 'q', id: 'S10', src: 'H&N p.26', core: true,
    q: 'What is label <b>9</b>?', fig: CVS.fig('hn-skull-lat-num', 'Skull lateral radiograph, labels replaced by numbers.', 'hn', 26),
    o: ['Sphenoid sinus', 'Ethmoid sinus', 'Maxillary sinus', 'Sella turcica', 'Nasopharynx'], a: 0,
    ex: 'Label 9 points to the air space in the sphenoid body under the sella: the sphenoid sinus. The ethmoid sinus (7) is further forward between the orbits.' },
  { t: 'q', id: 'S11', src: 'H&N p.26',
    q: 'What is label <b>6</b>?', fig: CVS.fig('hn-skull-lat-num', 'Skull lateral radiograph, labels replaced by numbers.', 'hn', 26),
    o: ['Clivus', 'Dorsum sellae', 'Occipital bone', 'Condyle of mandible', 'Mastoid air cells'], a: 0,
    ex: 'Label 6 points to the sloping bone running down and back behind the sella (dotted line): the clivus.' },
  { t: 'q', id: 'S12', src: 'H&N p.26', core: true,
    q: 'What is label <b>13</b>?', fig: CVS.fig('hn-skull-lat-num', 'Skull lateral radiograph, labels replaced by numbers.', 'hn', 26),
    o: ['Palatine process of maxilla (hard palate)', 'Maxillary sinus', 'Body of mandible', 'Zygomatic arch', 'Vomer'], a: 0,
    ex: 'Label 13 points to the horizontal bony plate between the nasal cavity and the mouth: the palatine process of the maxilla.' },
  { t: 'q', id: 'S13', src: 'H&N p.26',
    q: 'What is label <b>10</b>?', fig: CVS.fig('hn-skull-lat-num', 'Skull lateral radiograph, labels replaced by numbers.', 'hn', 26),
    o: ['Mastoid air cells', 'Condyle of mandible', 'Occipital bone', 'Clivus', 'Sphenoid sinus'], a: 0,
    ex: 'Label 10 points to the honeycomb of air behind the ear: the mastoid air cells. The condyle of the mandible (12) lies just in front of them.' },
  { t: 'tf', id: 'S14', src: 'H&N p.26–27', core: true,
    q: 'The clivus runs from the back of the sella turcica down and back toward the foramen magnum.', a: true,
    ex: 'True. The clivus continues from the dorsum sellae down the back of the sphenoid and basi-occiput.' },
  { t: 'c', id: 'S-C4', title: 'The sella turcica region', src: 'H&N p.27',
    html: '<div class="two">' + CVS.fig('hn-sella', 'Close-up of the central skull base on a lateral skull film.', 'hn', 27) +
      '<div class="stack"><ul class="pts"><li>The {{sella turcica}} is the saddle-shaped pit in the sphenoid body (the pituitary fossa).</li>' +
      '<li>In front: the {{tuberculum sellae}}. Above it, projecting back over the fossa: the {{anterior clinoid process}}.</li>' +
      '<li>Behind: the {{dorsum sellae}}, topped by the {{posterior clinoid process}}.</li>' +
      '<li>Below: the {{sphenoid sinus}}. Behind and down: the {{clivus}}.</li></ul>' +
      '<p class="note">Read along the top of the sphenoid from front to back: tuberculum → fossa → back wall, with a clinoid process at each end.</p></div></div>' },
  { t: 'q', id: 'S15', src: 'H&N p.27', core: true,
    q: 'Which structure forms the <b>back wall</b> of the sella turcica on a lateral film?',
    o: ['Dorsum sellae', 'Tuberculum sellae', 'Anterior clinoid process', 'Sphenoid sinus', 'Greater wing of sphenoid'], a: 0,
    ex: 'The dorsum sellae is the posterior wall, topped by the posterior clinoid process. The tuberculum sellae is the front.' },
  { t: 'q', id: 'S16', src: 'H&N p.26–27', core: true,
    q: 'What lies directly <b>below</b> the floor of the sella turcica?',
    o: ['Sphenoid sinus', 'Ethmoid sinus', 'Nasopharynx', 'Frontal sinus', 'Maxillary sinus'], a: 0,
    ex: 'The sella sits on the sphenoid body, and the sphenoid sinus is the air space inside that body.' },
  { t: 'tf', id: 'S17', src: 'H&N p.27',
    q: 'The tuberculum sellae lies behind the pituitary fossa.', a: false,
    ex: 'False. The tuberculum sellae is the front edge; the dorsum sellae is behind.' },
  { t: 'open', id: 'S18', src: 'H&N p.27',
    q: 'Name the parts of the sella region you meet from front to back (and above and below) on a lateral skull film.',
    ans: 'Front to back: tuberculum sellae → sella turcica (pituitary fossa) → dorsum sellae. Above: anterior clinoid process at the front, posterior clinoid process on top of the dorsum. Below: sphenoid sinus. Behind and down: clivus.' }
]});

/* Section O: the orbit (H&N radiology handout, slides 28–37). */
CVS.add({ id: 'O', short: 'Orbit', title: 'The orbit', kind: 'Lecture',
  blurb: 'Shape and neighbours, the seven bones and four walls, the blow-out fracture, and the orbit on radiograph, CT and MRI.',
  items: [
  { t: 'c', id: 'O-C1', title: 'Shape, axes and neighbours of the orbit', src: 'H&N p.29',
    html: '<div class="two"><div class="stack"><ul class="pts"><li>Paired {{conical}} bony cavities in the facial skeleton.</li>' +
      '<li>Each runs from the eyelids {{anterolaterally}} to the orbital apex {{posteromedially}}.</li>' +
      '<li>The two orbital axes diverge at about {{45°}} (green dashed lines on the MRI); the medial walls (blue) are nearly parallel.</li></ul>' +
      '<div class="tblwrap"><table class="tbl compact"><thead><tr><th>Neighbour</th><th>Across</th></tr></thead><tbody>' +
      '<tr><td>{{Anterior cranial fossa}}</td><td>Above (roof)</td></tr>' +
      '<tr><td>{{Nasal cavity and ethmoid air sinuses}}</td><td>Medial wall</td></tr>' +
      '<tr><td>{{Maxillary sinus}}</td><td>Below (floor)</td></tr></tbody></table></div>' +
      '<p class="note">Thin walls are shared walls: disease of the sinus next door (or a fracture) reaches the orbit through them.</p></div>' +
      CVS.fig('hn-orbit-axes', 'The orbit from the front with its neighbouring sinuses, and the orbital axes on axial MRI.', 'hn', 29) + '</div>' },
  { t: 'q', id: 'O1', src: 'H&N p.29', core: true,
    q: 'Which structure lies directly <b>below</b> the orbit?',
    o: ['Maxillary sinus', 'Anterior cranial fossa', 'Ethmoid air cells', 'Sphenoid sinus', 'Frontal sinus'], a: 0,
    ex: 'Above: anterior cranial fossa. Medial: nasal cavity and ethmoid air sinuses. Below: maxillary sinus.' },
  { t: 'q', id: 'O2', src: 'H&N p.29',
    q: 'At about what angle do the two orbital axes diverge?',
    o: ['10°', '25°', '45°', '90°', '120°'], a: 2,
    ex: 'The slide gives about 45° between the two orbital axes, while the medial walls stay nearly parallel.' },
  { t: 'tf', id: 'O3', src: 'H&N p.29',
    q: 'The orbit runs from the eyelids posteromedially to an apex that lies anterolaterally.', a: false,
    ex: 'False, it is reversed: from the eyelids anterolaterally to the apex posteromedially.' },
  { t: 'c', id: 'O-C2', title: 'Seven bones, four walls and an apex', src: 'H&N p.30–32',
    html: '<div class="two"><div class="tblwrap"><table class="tbl"><thead><tr><th>Wall</th><th>Mainly</th><th>With</th></tr></thead><tbody>' +
      '<tr><td><b>Roof</b> (superior)</td><td>Orbital part of the {{frontal bone}}</td><td>The smaller sphenoid wing</td></tr>' +
      '<tr><td><b>Medial wall</b> ({{lamina papyracea}})</td><td>Orbital plate of the {{ethmoid}}</td><td>Frontal process of maxilla, {{lacrimal}}, sphenoid</td></tr>' +
      '<tr><td><b>Floor</b> (inferior)</td><td>{{Orbital plate of maxilla}}</td><td>Zygomatic and {{palatine}}</td></tr>' +
      '<tr><td><b>Lateral wall</b></td><td>{{Frontal process of zygomatic}} bone</td><td>{{Greater wing of sphenoid}}</td></tr>' +
      '<tr><td><b>Apex</b></td><td>{{Optic canal}}</td><td>In the {{lesser wing of sphenoid}}</td></tr></tbody></table></div>' +
      CVS.fig('hn-orbit-bones', 'Bones of the right orbit seen from the front.', 'hn', 30) + '</div>' +
      '<p class="note">Seven bones in all. Roof, medial wall and floor are each “mainly” one bone; the sphenoid turns up in the roof, the medial wall, the lateral wall and the apex.</p>' },
  { t: 'q', id: 'O4', src: 'H&N p.31', core: true,
    q: 'The <b>lamina papyracea</b> is mainly the orbital plate of which bone?',
    o: ['Ethmoid', 'Lacrimal', 'Maxilla', 'Sphenoid', 'Frontal'], a: 0,
    ex: 'The medial wall (lamina papyracea) is mainly the orbital plate of the ethmoid, with the frontal process of maxilla, lacrimal and sphenoid.' },
  { t: 'q', id: 'O5', src: 'H&N p.31', core: true,
    q: 'The orbital <b>floor</b> is formed mainly by:',
    o: ['The orbital plate of the maxilla', 'The zygomatic bone', 'The palatine bone', 'The greater wing of sphenoid', 'The ethmoid'], a: 0,
    ex: 'Floor: mainly maxilla, with zygomatic and palatine. That is why a floor fracture opens into the maxillary sinus.' },
  { t: 'q', id: 'O6', src: 'H&N p.32',
    q: 'Which pair forms the <b>lateral wall</b> of the orbit?',
    o: ['Zygomatic bone and greater wing of sphenoid', 'Frontal bone and lesser wing of sphenoid', 'Ethmoid and lacrimal bones', 'Maxilla and palatine bones', 'Greater and lesser wings of sphenoid'], a: 0,
    ex: 'Lateral wall: frontal process of the zygomatic bone and the greater wing of sphenoid.' },
  { t: 'q', id: 'O7', src: 'H&N p.32', core: true,
    q: 'The optic canal at the orbital apex lies in the:',
    o: ['Lesser wing of sphenoid', 'Greater wing of sphenoid', 'Ethmoid', 'Frontal bone', 'Palatine bone'], a: 0,
    ex: 'Apex: optic canal in the lesser wing of sphenoid. The greater wing forms the lateral wall.' },
  { t: 'q', id: 'O8', src: 'H&N p.30',
    q: 'Which bone is <b>NOT</b> one of the seven bones of the orbit?',
    o: ['Temporal', 'Palatine', 'Lacrimal', 'Ethmoid', 'Zygomatic'], a: 0,
    ex: 'The seven: frontal, zygomatic, maxillary, ethmoid, lacrimal, sphenoid, palatine. The temporal bone is not part of the orbit.' },
  { t: 'c', id: 'O-C3', title: 'Weak walls and the blow-out fracture', src: 'H&N p.31',
    html: '<div class="two"><div class="stack"><ul class="pts"><li>The medial wall is paper-thin: its name, {{lamina papyracea}}, means “paper layer”.</li>' +
      '<li>A ball bigger than the orbital rim pushes the globe back and raises the {{pressure inside the orbit}}.</li>' +
      '<li>The thin {{floor}} gives way downward into the {{maxillary antrum}}: a <b>blow-out fracture</b>.</li>' +
      '<li>{{Orbital fat}} and the {{inferior rectus}} (with the {{inferior oblique}}) can herniate through the gap.</li></ul>' +
      CVS.fig('hn-squash', 'Squash ball injury: the force on the globe, the pressure rise and the fracture.', 'hn', 31) + '</div>' +
      CVS.fig('hn-blowout', 'Front-view diagram of a blow-out fracture on one side.', 'hn', 31) + '</div>' +
      '<p class="trap">The rim usually stays intact; the break is in the wall behind it, so look for it on {{coronal}} CT, where the bottom wall is seen edge-on.</p>' },
  { t: 'q', id: 'O9', src: 'H&N p.31', core: true,
    q: 'In the blow-out fracture drawn on the slide, which wall breaks, into which space, and what can herniate?',
    o: ['Floor → maxillary sinus; orbital fat and inferior rectus', 'Medial wall → ethmoid air cells; medial rectus', 'Roof → frontal sinus; superior rectus', 'Lateral wall → temporal fossa; lateral rectus', 'Floor → nasal cavity; superior oblique'], a: 0,
    ex: 'The pressure rise breaks the thin floor into the maxillary antrum, and orbital fat with the inferior rectus (and inferior oblique) can herniate into it.' },
  { t: 'tf', id: 'O10', src: 'H&N p.31', core: true,
    q: 'The lamina papyracea is the thin medial wall of the orbit.', a: true,
    ex: 'True. It separates the orbit from the ethmoid air cells.' },
  { t: 'open', id: 'O11', src: 'H&N p.31',
    q: 'Explain, step by step, how a ball larger than the orbital rim produces a blow-out fracture.',
    ans: 'The rim stops the ball, but the globe is pushed backward, so the pressure inside the orbit rises. The force escapes through the weakest wall: the thin floor breaks downward into the maxillary antrum, and orbital fat and the inferior rectus (with the inferior oblique) can herniate or be trapped in the gap.' },
  { t: 'c', id: 'O-C4', title: 'The orbit on an occipitofrontal radiograph', src: 'H&N p.33',
    html: CVS.fig('hn-orbit-of', 'Occipitofrontal radiograph of both orbits with labels.', 'hn', 33) +
      '<ul class="pts"><li>The rim: {{superior orbital margin}} above, {{inferior orbital margin}} below.</li>' +
      '<li>Inside the circle: the {{lesser wing}} of sphenoid above and the {{greater wing}} below and lateral; the dark cleft between them is the {{superior orbital fissure}}.</li>' +
      '<li>Medially: the thin {{lamina papyracea}} with the {{ethmoid sinus}} air cells beside it, and the {{nasal septum}} in the midline.</li></ul>' },
  { t: 'q', id: 'O12', src: 'H&N p.33', core: true,
    q: 'On the occipitofrontal view, the dark cleft between the lesser and greater wings of the sphenoid is the:',
    o: ['Superior orbital fissure', 'Inferior orbital fissure', 'Optic canal', 'Nasolacrimal canal', 'Infraorbital foramen'], a: 0,
    ex: 'The superior orbital fissure is the gap between the lesser wing (above) and the greater wing (below).' },
  { t: 'tf', id: 'O13', src: 'H&N p.33',
    q: 'The ethmoid air cells lie medial to the lamina papyracea, between the orbit and the nasal cavity.', a: true,
    ex: 'True. The lamina papyracea is the orbital (lateral) wall of the ethmoid labyrinth.' },
  { t: 'c', id: 'O-C5', title: 'The orbit on axial CT', src: 'H&N p.34',

      '<div class="cols3"><div class="mini"><h4>Upper slice</h4><ul><li>{{Levator palpebrae superioris & superior rectus}} on top of the globe</li><li>{{Superior oblique}} along the upper medial wall</li><li>{{Lacrimal gland}} at the front, upper lateral</li><li>Behind: the {{superior orbital fissure}} beside the greater wing</li></ul></div>' +
      '<div class="mini"><h4>Mid slice (optic nerve)</h4><ul><li>{{Medial rectus}} and {{lateral rectus}} along the walls</li><li>The {{optic nerve sheath complex}} runs back to the apex and leaves through the {{optic canal}}</li><li>Medial wall: lamina papyracea</li></ul></div>' +
      '<div class="mini"><h4>Lower slice</h4><ul><li>{{Inferior rectus}} under the globe</li><li>{{Nasolacrimal duct}} at the front of the medial wall</li><li>{{Inferior orbital fissure}} at the back</li></ul></div></div>' },
  { t: 'q', id: 'O14', src: 'H&N p.34', core: true,
    q: 'On axial CT at the level of the optic nerve, which muscles lie along the medial and lateral orbital walls?',

    ex: 'At the optic nerve level the medial and lateral recti run along the walls on either side of the optic nerve sheath complex.' },
  { t: 'q', id: 'O15', src: 'H&N p.34',
    q: 'On the upper axial slice, which structure sits at the front of the orbit, upper and lateral?',
    o: ['Lacrimal gland', 'Superior oblique', 'Nasolacrimal duct', 'Medial rectus', 'Optic nerve'], a: 0,
    ex: 'The lacrimal gland lies in the upper outer front of the orbit. The superior oblique is upper medial; the nasolacrimal duct is low and medial.' },
  { t: 'q', id: 'O16', src: 'H&N p.34',
    q: 'On the lowest axial slice, the small canal at the front of the medial wall is the:',
    o: ['Nasolacrimal duct', 'Optic canal', 'Inferior orbital fissure', 'Superior orbital fissure', 'Ethmoid air cell'], a: 0,
    ex: 'The nasolacrimal duct runs down at the front of the medial wall, from the lacrimal sac to the nose.' },
  { t: 'q', id: 'O17', src: 'H&N p.32, 34', core: true,
    q: 'The optic nerve leaves the orbit through the:',
    o: ['Optic canal', 'Superior orbital fissure', 'Inferior orbital fissure', 'Nasolacrimal canal', 'Infraorbital foramen'], a: 0,
    ex: 'The optic nerve sheath complex runs to the apex and passes through the optic canal in the lesser wing of sphenoid.' },
  { t: 'c', id: 'O-C6', title: 'The orbit in the coronal plane: CT and MRI', src: 'H&N p.35–37',
    html: '<div class="two">' + CVS.fig('hn-orbit-cor1', 'Coronal CT through the globes, soft tissue window.', 'hn', 35) + CVS.fig('hn-orbit-mri2', 'Coronal T2-weighted MRI behind the globe.', 'hn', 37) + '</div>' +
      '<ul class="pts"><li>At the globe: the {{lacrimal gland}} superolateral; the recti hug the globe.</li>' +
      '<li>Behind the globe the muscles form a ring around the {{optic nerve sheath complex}}: levator and superior rectus on top, {{medial rectus}}, {{inferior rectus}}, {{lateral rectus}}, and the {{superior oblique}} superomedially.</li>' +

      '<li>The {{inferior oblique}} runs under the front of the globe (MRI, p.36).</li>' +
      '<li>On T2 MRI the {{orbital fat}} is bright and the muscles are dark. Toward the apex the cone narrows and the muscles crowd around the nerve.</li></ul>' },
  { t: 'q', id: 'O18', src: 'H&N p.35, 37', core: true,

    o: ['Optic nerve sheath complex', 'Superior ophthalmic vein', 'Lacrimal gland', 'Inferior oblique', 'Ethmoid air cell'], a: 0,

  { t: 'q', id: 'O19', src: 'H&N p.37',

  { t: 'tf', id: 'O20', src: 'H&N p.37',
    q: 'On the coronal T2 MRI, the superior ophthalmic vein lies just below the inferior rectus.', a: false,
    ex: 'False. The superior ophthalmic vein lies just below the superior rectus; the inferior ophthalmic vein is low in the inferolateral fat.' },
  { t: 'q', id: 'O21', src: 'H&N p.36',
    q: 'Which muscle is seen under the front of the globe on coronal MRI, but is not part of the cone of recti at the back?',
    o: ['Inferior oblique', 'Inferior rectus', 'Superior oblique', 'Medial rectus', 'Levator palpebrae superioris'], a: 0,

]});

/* Section N: temporal bone and ear, nasal cavity and paranasal sinuses (H&N radiology handout, slides 38–47). */
CVS.add({ id: 'N', short: 'Ear, nose, sinuses', title: 'Temporal bone, nasal cavity and paranasal sinuses', kind: 'Lecture',
  blurb: 'The petrous bone and the ear on CT, the nasal cavity, the four sinuses on films and CT, and the ostiomeatal unit.',
  items: [
  { t: 'c', id: 'N-C1', title: 'Temporal bone: the petrous pyramid and the parts of the ear', src: 'H&N p.39',

      '<div class="mini"><h4>Inner</h4><ul><li>{{Bony labyrinth}}</li><li>Perilymphatic spaces</li><li>{{Membranous labyrinth}}</li></ul></div></div></div>' +

  { t: 'q', id: 'N2', src: 'H&N p.39',

  { t: 'tf', id: 'N3', src: 'H&N p.39',
    q: '“Petrous” means stone-like, which fits the dense pyramid of bone that houses the inner ear.', a: true,

  { t: 'c', id: 'N-C2', title: 'Temporal bone on axial CT', src: 'H&N p.40',

      '<ul class="pts"><li>Read along the hearing path, lateral to medial: {{external auditory canal}} → {{middle ear}} (the {{malleus}} sits in it) → inner ear, with the {{cochlea}} in front and the {{semicircular canal}} behind.</li>' +

  { t: 'q', id: 'N6', src: 'H&N p.40',

  { t: 'c', id: 'N-C3', title: 'The nasal cavity', src: 'H&N p.42–43',
    html: '<div class="two"><div class="stack"><ul class="pts"><li>Extends from the {{palate}} (floor) to the {{skull base}} (roof).</li>' +

  { t: 'c', id: 'N-C4', title: 'Paranasal sinuses on plain films', src: 'H&N p.26, 44',

  { t: 'c', id: 'N-C5', title: 'The ostiomeatal unit on coronal CT', src: 'H&N p.45',
