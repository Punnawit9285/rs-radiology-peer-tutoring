<div id="app">
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 38 22" aria-hidden="true"><path d="M19,1 V9 M19,9 C16,11 13,12 10,14 M19,9 C22,11 25,12 28,14" fill="none" stroke="var(--art)" stroke-width="2.2" stroke-linecap="round"/><path d="M9,4 C4,7 3,14 4,20 C7,21 11,20 14,18 C14,12 13,7 9,4 Z M29,4 C34,7 35,14 34,20 C31,21 27,20 24,18 C24,12 25,7 29,4 Z" fill="none" stroke="var(--ven)" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <div><b>Radiologic Anatomy</b><small>Peer support 82 deck &#183; RS I radiology lectures</small></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="ctrls">
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="vPresent" aria-pressed="true">Present</button>
      <button type="button" id="vBrowse" aria-pressed="false">Browse</button>
    </div>
    <label class="chk" for="coreOnly"><input type="checkbox" id="coreOnly"> Core only</label>
    <button type="button" class="icon" id="themeBtn" aria-label="Switch between light and dark"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8,1.5 A6.5,6.5 0 0 1 8,14.5 Z" fill="currentColor"/></svg></button>
    <button type="button" class="icon" id="fsBtn" aria-label="Full screen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5,5.5 V1.5 H5.5 M10.5,1.5 H14.5 V5.5 M14.5,10.5 V14.5 H10.5 M5.5,14.5 H1.5 V10.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
</header>
<main>
  <section id="present" aria-label="Present mode">
    <div class="stage" id="stage"></div>
    <div class="pager">
      <button type="button" class="btn" id="prev">&#8592; Prev</button>
      <div class="pos" id="pos" aria-live="polite"></div>
      <button type="button" class="btn primary" id="reveal">Reveal</button>
      <button type="button" class="btn" id="next">Next &#8594;</button>
      <div class="prog"><i id="progBar"></i></div>
      <div class="keys">&#8592; &#8594; move &#183; Space reveal / next blank &#183; Enter all blanks &#183; A&#8211;F choose &#183; T / F true-false &#183; R reset &#183; L Thai &#183; B browse</div>
    </div>
  </section>
  <section id="browse" aria-label="Browse mode" hidden>
    <div class="btools">
      <input type="search" id="q" placeholder="Search: Waters, carina, silhouette, O7&#8230;" aria-label="Search questions and concepts">
      <label class="chk" for="showAll"><input type="checkbox" id="showAll"> Show all answers</label>
      <span class="bcount" id="bcount"></span>
    </div>
    <div id="blist"></div>
  </section>
</main>
</div>
